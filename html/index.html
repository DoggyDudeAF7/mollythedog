<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Molly & Shaina</title>
  <link rel="icon" href="/favicon.ico?v=20260817-2" type="image/x-icon" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260817-2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260817-2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260817-2">
  <link rel="manifest" href="/site.webmanifest?v=20260817-2">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background: #07070c;
      color: white;
      overflow: hidden;
    }

    /* Same glowing background style as the main site */
    .bg {
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 140, 120, 0.25),
          transparent 50%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(140, 120, 255, 0.25),
          transparent 50%
        ),
        linear-gradient(180deg, #07070c, #040406);

      z-index: -1;
    }

    .redirect-card {
      width: min(460px, 92vw);

      padding: 48px 42px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.03)
        );

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(255, 255, 255, 0.03);

      backdrop-filter: blur(14px);

      animation: cardAppear 0.55s ease-out both;
    }

    /* Spinner */
    .spinner {
      width: 54px;
      height: 54px;

      margin: 0 auto 26px;

      border-radius: 50%;

      border: 5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffb7a5;
      border-right-color: #bfa8ff;

      animation: spin 0.8s linear infinite;

      filter:
        drop-shadow(0 0 10px rgba(255, 183, 165, 0.3))
        drop-shadow(0 0 12px rgba(191, 168, 255, 0.25));
    }

    h1 {
      margin-bottom: 12px;

      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.05;

      background: linear-gradient(
        90deg,
        #ffb7a5,
        #bfa8ff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #cfcfcf;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* Loading bar */
    .loading-track {
      width: 100%;
      height: 11px;

      background: rgba(255, 255, 255, 0.10);

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;

      overflow: hidden;
    }

    .loading-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #ffb7a5,
          #bfa8ff
        );

      box-shadow:
        0 0 18px rgba(191, 168, 255, 0.45);

      animation: fakeLoad 3s ease-in-out forwards;
    }

    .status {
      margin-top: 14px;

      color: rgba(255, 255, 255, 0.55);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fakeLoad {
      0% {
        width: 0%;
      }

      18% {
        width: 14%;
      }

      40% {
        width: 38%;
      }

      63% {
        width: 67%;
      }

      82% {
        width: 84%;
      }

      94% {
        width: 93%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 520px) {
      .redirect-card {
        padding: 38px 24px;
        border-radius: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .redirect-card,
      .spinner,
      .loading-fill {
        animation-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <main class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>

    <h1>Redirecting…</h1>

    <p>
      Taking you to the Molly & Shaina preview.
    </p>

    <div class="loading-track">
      <div class="loading-fill"></div>
    </div>

    <div class="status">
      Loading preview…
    </div>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace('/html/preview/index.html');
    }, 3000);
  </script>
</body>
</html>
