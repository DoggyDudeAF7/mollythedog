<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Redirecting to Molly & Shaina.">

  <title>Molly &amp; Shaina</title>

  <link rel="icon" href="/favicon.ico?v=20260817-2" type="image/x-icon" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260817-2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260817-2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260817-2">
  <link rel="manifest" href="/site.webmanifest?v=20260817-2">

  <meta name="theme-color" content="#07070c">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #07070c;
      color: white;

      overflow: hidden;
    }

    /* Main glowing background */
    .bg {
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 140, 120, 0.25),
          transparent 50%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(140, 120, 255, 0.25),
          transparent 50%
        ),
        linear-gradient(
          180deg,
          #07070c,
          #040406
        );

      z-index: -2;
    }

    /* Subtle moving glow */
    .bg::before,
    .bg::after {
      content: "";

      position: absolute;

      width: 360px;
      height: 360px;

      border-radius: 50%;

      filter: blur(80px);

      opacity: 0.24;

      animation: glowMove 7s ease-in-out infinite alternate;
    }

    .bg::before {
      top: -120px;
      left: -100px;

      background: #ff9f88;
    }

    .bg::after {
      right: -120px;
      bottom: -120px;

      background: #9f86ff;

      animation-delay: -3.5s;
    }

    .redirect-card {
      width: min(460px, 92vw);

      padding: 48px 42px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.03)
        );

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(255, 255, 255, 0.03);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      animation: cardAppear 0.45s ease-out both;
    }

    /* Spinner */
    .spinner {
      width: 54px;
      height: 54px;

      margin: 0 auto 26px;

      border-radius: 50%;

      border: 5px solid rgba(255, 255, 255, 0.12);

      border-top-color: #ffb7a5;
      border-right-color: #bfa8ff;

      animation: spin 0.72s linear infinite;

      filter:
        drop-shadow(0 0 10px rgba(255, 183, 165, 0.3))
        drop-shadow(0 0 12px rgba(191, 168, 255, 0.25));
    }

    h1 {
      margin-bottom: 12px;

      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 900;

      line-height: 1.05;

      background:
        linear-gradient(
          90deg,
          #ffb7a5,
          #bfa8ff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      background-clip: text;
      color: transparent;
    }

    p {
      margin-bottom: 28px;

      color: #cfcfcf;

      font-size: 1rem;
      line-height: 1.7;
    }

    /* Loading bar */
    .loading-track {
      width: 100%;
      height: 11px;

      background: rgba(255, 255, 255, 0.1);

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;

      overflow: hidden;
    }

    .loading-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #ffb7a5,
          #bfa8ff
        );

      box-shadow:
        0 0 18px rgba(191, 168, 255, 0.45);

      animation-name: fakeLoad;
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;
    }

    .status {
      margin-top: 14px;

      color: rgba(255, 255, 255, 0.55);

      font-size: 0.82rem;
      font-weight: 600;

      letter-spacing: 0.04em;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fakeLoad {
      0% {
        width: 0%;
      }

      12% {
        width: 8%;
      }

      26% {
        width: 20%;
      }

      42% {
        width: 39%;
      }

      58% {
        width: 60%;
      }

      73% {
        width: 77%;
      }

      86% {
        width: 89%;
      }

      94% {
        width: 95%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform:
          translateY(16px)
          scale(0.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes glowMove {
      from {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      to {
        transform:
          translate3d(45px, 25px, 0)
          scale(1.15);
      }
    }

    @media (max-width: 520px) {
      .redirect-card {
        padding: 38px 24px;

        border-radius: 24px;
      }

      .spinner {
        width: 48px;
        height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .redirect-card,
      .spinner,
      .loading-fill,
      .bg::before,
      .bg::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="redirect-card">
    <div
      class="spinner"
      aria-hidden="true"
    ></div>

    <h1>
      Redirecting…
    </h1>

    <p>
      Taking you to Molly &amp; Shaina.
    </p>

    <div
      class="loading-track"
      role="progressbar"
      aria-label="Loading Molly and Shaina"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div class="loading-fill"></div>
    </div>

    <div
      class="status"
      id="statusText"
    >
      Loading…
    </div>
  </main>

  <script>
    /*
      Random redirect delay:
      minimum = 0.8 seconds
      maximum = 1.2 seconds

      Examples:
      0.9764 seconds
      1.14583 seconds
      0.81362 seconds
      etc.
    */

    const minDelay = 800;
    const maxDelay = 1200;

    const delay =
      minDelay +
      Math.random() *
      (maxDelay - minDelay);

    const loadingFill =
      document.querySelector(".loading-fill");

    const loadingTrack =
      document.querySelector(".loading-track");

    const statusText =
      document.getElementById("statusText");

    /*
      Make the loading bar take exactly as long
      as the randomly generated redirect delay.
    */
    loadingFill.style.animationDuration =
      `${delay}ms`;

    /*
      Optional progress tracking so the ARIA
      progress value changes along with the bar.
    */
    const startTime =
      performance.now();

    function updateProgress(currentTime) {
      const elapsed =
        currentTime - startTime;

      const progress =
        Math.min(
          100,
          (elapsed / delay) * 100
        );

      loadingTrack.setAttribute(
        "aria-valuenow",
        Math.round(progress)
      );

      if (progress < 100) {
        requestAnimationFrame(
          updateProgress
        );
      }
    }

    requestAnimationFrame(
      updateProgress
    );

    /*
      Change the tiny status text near the end.
    */
    setTimeout(() => {
      statusText.textContent =
        "Almost there…";
    }, delay * 0.65);

    /*
      Redirect at the exact end of the randomly
      chosen loading duration.
    */
    setTimeout(() => {
      statusText.textContent =
        "Ready";

      window.location.href =
        "home.html";
    }, delay);
  </script>
</body>
</html>
