<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Molly & Shaina</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .redirect-box {
      width: min(90%, 420px);
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid #ddd;
      border-top-color: #222;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 22px;
      color: #666;
    }

    .loading-bar {
      width: 100%;
      height: 10px;
      background: #ddd;
      border-radius: 999px;
      overflow: hidden;
    }

    .loading-progress {
      width: 0%;
      height: 100%;
      background: #222;
      border-radius: inherit;
      animation: load 3s ease-in-out forwards;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes load {
      0% {
        width: 0%;
      }

      35% {
        width: 28%;
      }

      60% {
        width: 62%;
      }

      82% {
        width: 84%;
      }

      100% {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="redirect-box">
    <div class="spinner"></div>

    <h1>Redirecting…</h1>
    <p>Taking you to the preview homepage...</p>

    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace('/html/preview/index.html');
    }, 3000);
  </script>
</body>
</html>
