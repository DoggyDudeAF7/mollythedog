<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#07070c">
    <title>Private Access</title>
    <link rel="icon" href="../favicon.ico" sizes="48x48">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/blog.css">
  </head>
  <body>
    <div class="bg"></div>
    <main class="blog-page login-page">
      <section class="blog-hero login-panel" aria-labelledby="accessTitle">
        <p class="blog-kicker">Hidden Door</p>
        <h1 id="accessTitle">Private Access</h1>
        <p>Enter the password to continue to the main site.</p>
        <form class="login-form" id="siteAccessForm">
          <label for="siteAccessPassword">Password</label>
          <input id="siteAccessPassword" name="password" type="password" autocomplete="current-password" required autofocus>
          <button type="submit">Continue</button>
          <p class="admin-status" id="siteAccessStatus" role="status" aria-live="polite" hidden></p>
        </form>
        <div class="blog-actions">
          <a href="../preview/">Back to preview</a>
        </div>
      </section>
    </main>
    <script src="../js/site-access.js"></script>
  </body>
</html>
